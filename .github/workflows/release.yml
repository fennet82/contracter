name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, as vX.Y.Z (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write # create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Passed through the environment, never pasted into a script: the tag
      # is typed by whoever starts the workflow.
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          # Static, so the binary runs on hosts with a different libc.
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o contracter ./cmd/contracter
          tar -czf "contracter-$TAG-linux-amd64.tar.gz" contracter

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag at the commit the workflow ran on. Fails if the
        # release already exists.
        run: gh release create "$TAG" "contracter-$TAG-linux-amd64.tar.gz" --target "$GITHUB_SHA" --title "$TAG" --notes ""
