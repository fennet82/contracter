name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, as vX.Y.Z (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write # create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Passed through the environment, never pasted into a script: the tag
      # is typed by whoever starts the workflow.
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            bin=contracter
            if [ "$os" = windows ]; then bin=contracter.exe; fi
            # Static, so the binary does not depend on the host's libc.
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/$os-$arch/$bin" ./cmd/contracter
            tar -czf "dist/contracter-$TAG-$os-$arch.tar.gz" -C "dist/$os-$arch" "$bin"
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag at the commit the workflow ran on. Fails if the
        # release already exists.
        run: gh release create "$TAG" dist/*.tar.gz --target "$GITHUB_SHA" --title "$TAG" --notes ""
